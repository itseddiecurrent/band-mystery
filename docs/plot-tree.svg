<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1080" viewBox="0 0 1260 1080" role="img" aria-labelledby="title desc"><title id="title">昨夜剧情分支</title><desc id="desc">洛克是否拿走小莉的饮料，以及是否叫住小莉，决定车辆事件的三种结果。屏蔽器事件独立分支，待设计。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#94a3b8"/></marker></defs><rect width="1260" height="1080" fill="#101724"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style>
<text x="45" y="55" text-anchor="start" fill="#f6f0e5" font-size="34" font-weight="bold">昨夜 · 剧情分支</text>
<text x="1215" y="53" text-anchor="end" fill="#aebbd0" font-size="17" font-weight="normal">创作草案 · 含剧透</text>
<rect x="45" y="90" width="1170" height="90" rx="14" fill="#192438" stroke="#94a3b8" stroke-width="2"/>
<text x="630.0" y="125" text-anchor="middle" fill="#94a3b8" font-size="23" font-weight="bold">现有主线</text>
<text x="630.0" y="159" text-anchor="middle" fill="#e9eef7" font-size="21" font-weight="normal">醒来 → 发现亚瑟 → 寻人救援 → 调查举证 → 蛋仔被捕 → 尾声</text>
<rect x="440" y="215" width="380" height="60" rx="14" fill="#192438" stroke="#e6bf78" stroke-width="2"/>
<text x="630.0" y="250" text-anchor="middle" fill="#e6bf78" font-size="23" font-weight="bold">新增：庆功宴中的选择</text>
<rect x="440" y="310" width="380" height="60" rx="14" fill="#192438" stroke="#e6bf78" stroke-width="2"/>
<text x="630.0" y="345" text-anchor="middle" fill="#e6bf78" font-size="23" font-weight="bold">洛克拿走小莉的饮料？</text>
<path d="M630,275 V292.5 H630 V310" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="430" width="350" height="100" rx="14" fill="#192438" stroke="#8db9ff" stroke-width="2"/>
<text x="220.0" y="465" text-anchor="middle" fill="#8db9ff" font-size="23" font-weight="bold">不拿</text>
<text x="220.0" y="499" text-anchor="middle" fill="#e9eef7" font-size="21" font-weight="normal">小莉喝下，受药物影响</text>
<rect x="625" y="430" width="500" height="100" rx="14" fill="#192438" stroke="#e9b783" stroke-width="2"/>
<text x="875.0" y="465" text-anchor="middle" fill="#e9b783" font-size="23" font-weight="bold">拿走</text>
<text x="875.0" y="499" text-anchor="middle" fill="#e9eef7" font-size="21" font-weight="normal">小莉保持清醒，想保护小柔</text>
<path d="M530,370 V400.0 H220 V430" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<text x="375.0" y="388.0" text-anchor="middle" fill="#cbd5e1" font-size="19" font-weight="normal">不拿</text>
<path d="M730,370 V400.0 H875 V430" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<text x="802.5" y="388.0" text-anchor="middle" fill="#cbd5e1" font-size="19" font-weight="normal">拿走</text>
<rect x="675" y="570" width="400" height="60" rx="14" fill="#192438" stroke="#e6bf78" stroke-width="2"/>
<text x="875.0" y="605" text-anchor="middle" fill="#e6bf78" font-size="23" font-weight="bold">洛克叫住正要溜走的小莉？</text>
<path d="M875,530 V550.0 H875 V570" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="45" y="705" width="350" height="145" rx="14" fill="#192438" stroke="#8db9ff" stroke-width="2"/>
<text x="220.0" y="740" text-anchor="middle" fill="#8db9ff" font-size="23" font-weight="bold">蛋仔动手</text>
<text x="220.0" y="774" text-anchor="middle" fill="#e9eef7" font-size="21" font-weight="normal">小莉错过机会</text>
<text x="220.0" y="805" text-anchor="middle" fill="#e9eef7" font-size="21" font-weight="normal">威利撞墙身亡</text>
<text x="220.0" y="836" text-anchor="middle" fill="#e9eef7" font-size="21" font-weight="normal">手机找回</text>
<rect x="455" y="705" width="350" height="145" rx="14" fill="#192438" stroke="#e9b783" stroke-width="2"/>
<text x="630.0" y="740" text-anchor="middle" fill="#e9b783" font-size="23" font-weight="bold">小莉先动手</text>
<text x="630.0" y="774" text-anchor="middle" fill="#e9eef7" font-size="21" font-weight="normal">小莉先到停车处</text>
<text x="630.0" y="805" text-anchor="middle" fill="#e9eef7" font-size="21" font-weight="normal">威利坠崖身亡</text>
<text x="630.0" y="836" text-anchor="middle" fill="#e9eef7" font-size="21" font-weight="normal">手机无法找回</text>
<rect x="865" y="705" width="350" height="145" rx="14" fill="#192438" stroke="#98d5b1" stroke-width="2"/>
<text x="1040.0" y="740" text-anchor="middle" fill="#98d5b1" font-size="23" font-weight="bold">两人互相阻碍</text>
<text x="1040.0" y="774" text-anchor="middle" fill="#e9eef7" font-size="21" font-weight="normal">小莉与蛋仔碰面，均未动手</text>
<text x="1040.0" y="805" text-anchor="middle" fill="#e9eef7" font-size="21" font-weight="normal">威利活着离开</text>
<text x="1040.0" y="836" text-anchor="middle" fill="#e9eef7" font-size="21" font-weight="normal">随后被警方逮捕</text>
<path d="M220,530 V617.5 H220 V705" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<path d="M775,630 V667.5 H630 V705" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<text x="702.5" y="655.5" text-anchor="middle" fill="#cbd5e1" font-size="19" font-weight="normal">放她走</text>
<path d="M975,630 V667.5 H1040 V705" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<text x="1007.5" y="655.5" text-anchor="middle" fill="#cbd5e1" font-size="19" font-weight="normal">叫住她聊天／喝一杯</text>
<rect x="45" y="895" width="1170" height="95" rx="14" fill="#192438" stroke="#b9a0e8" stroke-width="2"/>
<text x="630.0" y="930" text-anchor="middle" fill="#b9a0e8" font-size="23" font-weight="bold">屏蔽器：独立分支，待设计</text>
<text x="630.0" y="964" text-anchor="middle" fill="#e9eef7" font-size="21" font-weight="normal">谁偷走？谁开启／藏起？不由车辆分支决定。</text>
<text x="630" y="1035" text-anchor="middle" fill="#aebbd0" font-size="18" font-weight="normal">待补：洛克昏睡前的时间衔接、屏蔽器相关选择。</text>
</svg>